# ESPHome: S-Thermatik NEO ("NEO basic") via BLE -> Home Assistant
# Protocol: write register addresses (uint16 LE) to FFF1, wait ~1 s, read FFF2 (5x int16 LE)
# UNTESTED - verify reading first, then cross-check the controls once against the app.

# Entity language: include ONE of the two files (English or German entity names).
# Switching later renames the entities in Home Assistant.
packages:
  lang: !include lang/en.yaml
  # lang: !include lang/de.yaml

esphome:
  name: kamin-neo
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    active: true
  # Step 1: find the controller's real MAC address (it then shows up in the ESPHome log)
  on_ble_advertise:
    - then:
        - lambda: |-
            if (x.get_name() == "NEO basic")
              ESP_LOGI("neo", "Found NEO basic: %s", x.address_str().c_str());

ble_client:
  - mac_address: "AA:BB:CC:DD:EE:FF"   # <- enter the address from the log
    id: neo
    on_connect:
      then:
        - logger.log: "NEO connected"
    on_disconnect:
      then:
        - logger.log: "NEO disconnected"

globals:
  - id: block
    type: int
    initial_value: '0'

# Raw read of FFF2; distributes the values according to the current block
sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: neo
    id: fff2_raw
    internal: true
    service_uuid: 'fff0'
    characteristic_uuid: 'fff2'
    update_interval: never
    lambda: |-
      if (x.size() < 10) return NAN;
      int16_t v[5];
      for (int i = 0; i < 5; i++) v[i] = (int16_t)(x[2*i] | (x[2*i+1] << 8));
      ESP_LOGD("neo", "Block %d: %d %d %d %d %d", id(block), v[0], v[1], v[2], v[3], v[4]);
      switch (id(block)) {
        case 0:  // 1CCE 1E62 1CD4 1EF2 1D98
          if (v[0] != 1234) return NAN;   // sanity check: 0x1CCE is always 1234
          id(air_damper).publish_state(v[1]);
          id(phase).publish_state(v[2]);
          id(reg_1d98).publish_state(v[4]);
          break;
        case 1:  // 1E2A 1D4E 1E64 1CBE 1E82
          id(heating_power).publish_state(v[3]);
          id(reg_1e82).publish_state(v[4]);
          break;
        case 2:  // 1EA2 1D96 1E8C 1DEC 1E7C
          id(room_temp).publish_state(v[0]);
          id(flue_gas_temp).publish_state(v[1]);
          id(damper_manual).publish_state(v[3] == 1);
          id(door).publish_state(v[4] == 1);
          break;
      }
      return v[0];

  - platform: template
    id: flue_gas_temp
    name: "${name_flue_gas_temp}"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
  - platform: template
    id: air_damper
    name: "${name_air_damper}"
    unit_of_measurement: "%"
    state_class: measurement
  - platform: template
    id: heating_power
    name: "${name_heating_power}"
    state_class: measurement
  - platform: template
    id: room_temp
    name: "${name_room_temp}"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
  - platform: template
    id: phase
    name: "${name_phase}"
  - platform: template
    id: reg_1e82
    name: "${name_reg_1e82}"
  - platform: template
    id: reg_1d98
    name: "${name_reg_1d98}"

binary_sensor:
  - platform: template
    id: damper_manual
    name: "${name_damper_manual}"
  - platform: template
    id: door
    name: "${name_door}"
    device_class: door

# Turn off to disconnect so the phone app can connect again (only 1 connection possible)
switch:
  - platform: ble_client
    ble_client_id: neo
    name: "${name_ble_connected}"
  - platform: template
    name: "${name_damper_auto}"
    lambda: 'return !id(damper_manual).state;'
    turn_on_action:
      - script.execute:
          id: write_reg
          addr: 0x1DEC
          val: 0
    turn_off_action:
      - script.execute:
          id: write_reg
          addr: 0x1DEC
          val: 1

interval:
  - interval: 15s
    then:
      - script.execute: poll

script:
  # Write a register like the app does: FFF1 <- address, FFF2 <- value (int16 LE)
  - id: write_reg
    mode: queued
    parameters:
      addr: int
      val: int
    then:
      - script.wait: poll
      - ble_client.ble_write:
          id: neo
          service_uuid: 'fff0'
          characteristic_uuid: 'fff1'
          value: !lambda |-
            return std::vector<uint8_t>{ (uint8_t)(addr & 0xFF), (uint8_t)((addr >> 8) & 0xFF) };
      - delay: 300ms
      - ble_client.ble_write:
          id: neo
          service_uuid: 'fff0'
          characteristic_uuid: 'fff2'
          value: !lambda |-
            uint16_t v = (uint16_t)(int16_t) val;
            return std::vector<uint8_t>{ (uint8_t)(v & 0xFF), (uint8_t)(v >> 8) };
      - logger.log:
          format: "Register 0x%04X <- %d"
          args: [ 'addr', 'val' ]
      - delay: 500ms

  - id: poll
    mode: single
    then:
      - script.wait: write_reg
      - globals.set: { id: block, value: '0' }
      - ble_client.ble_write:
          id: neo
          service_uuid: 'fff0'
          characteristic_uuid: 'fff1'
          value: [0xCE, 0x1C, 0x62, 0x1E, 0xD4, 0x1C, 0xF2, 0x1E, 0x98, 0x1D]
      - delay: 1500ms
      - component.update: fff2_raw
      - delay: 700ms

      - globals.set: { id: block, value: '1' }
      - ble_client.ble_write:
          id: neo
          service_uuid: 'fff0'
          characteristic_uuid: 'fff1'
          value: [0x2A, 0x1E, 0x4E, 0x1D, 0x64, 0x1E, 0xBE, 0x1C, 0x82, 0x1E]
      - delay: 1500ms
      - component.update: fff2_raw
      - delay: 700ms

      - globals.set: { id: block, value: '2' }
      - ble_client.ble_write:
          id: neo
          service_uuid: 'fff0'
          characteristic_uuid: 'fff1'
          value: [0xA2, 0x1E, 0x96, 0x1D, 0x8C, 0x1E, 0xEC, 0x1D, 0x7C, 0x1E]
      - delay: 1500ms
      - component.update: fff2_raw
      - delay: 700ms
      - globals.set: { id: block, value: '-1' }

# ---------------- Controls ----------------
# From PacketLogger traces:
#   0x1CBE  heating power 1..3
#   0x1DEC  air damper mode: 1 = manual, 0 = automatic
#   0x1E62  air damper in % (set in manual mode)

number:
  - platform: template
    name: "${name_set_heating_power}"
    min_value: 1
    max_value: 3
    step: 1
    lambda: 'return id(heating_power).state;'
    set_action:
      - script.execute:
          id: write_reg
          addr: 0x1CBE
          val: !lambda 'return (int) x;'

  - platform: template
    name: "${name_set_damper_manual}"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: slider
    lambda: 'return id(air_damper).state;'
    set_action:
      # like the app: enable manual mode first, then set the value
      - script.execute:
          id: write_reg
          addr: 0x1DEC
          val: 1
      - script.execute:
          id: write_reg
          addr: 0x1E62
          val: !lambda 'return (int) x;'
