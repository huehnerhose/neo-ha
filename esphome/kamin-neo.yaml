# ESPHome: S-Thermatik NEO ("NEO basic") per BLE -> Home Assistant
# Protokoll: Registeradressen (uint16 LE) nach FFF1 schreiben, ~1 s warten, FFF2 lesen (5x int16 LE)
# UNGETESTET - erst das Lesen pruefen, dann die Steuerung einmal mit offener App gegenchecken.

esphome:
  name: kamin-neo
  friendly_name: Kamin

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    active: true
  # Schritt 1: echte MAC der Steuerung finden (steht dann im ESPHome-Log)
  on_ble_advertise:
    - then:
        - lambda: |-
            if (x.get_name() == "NEO basic")
              ESP_LOGI("neo", "NEO basic gefunden: %s", x.address_str().c_str());

ble_client:
  - mac_address: "AA:BB:CC:DD:EE:FF"   # <- aus dem Log eintragen
    id: neo
    on_connect:
      then:
        - logger.log: "NEO verbunden"
    on_disconnect:
      then:
        - logger.log: "NEO getrennt"

globals:
  - id: block
    type: int
    initial_value: '0'

# Rohes Lesen von FFF2, verteilt die Werte je nach aktuellem Block
sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: neo
    id: fff2_raw
    internal: true
    service_uuid: 'fff0'
    characteristic_uuid: 'fff2'
    update_interval: never
    lambda: |-
      if (x.size() < 10) return NAN;
      int16_t v[5];
      for (int i = 0; i < 5; i++) v[i] = (int16_t)(x[2*i] | (x[2*i+1] << 8));
      ESP_LOGD("neo", "Block %d: %d %d %d %d %d", id(block), v[0], v[1], v[2], v[3], v[4]);
      switch (id(block)) {
        case 0:  // 1CCE 1E62 1CD4 1EF2 1D98
          if (v[0] != 1234) return NAN;   // Plausibilitaet: 0x1CCE ist immer 1234
          id(luftschieber).publish_state(v[1]);
          id(phase).publish_state(v[2]);
          id(reg_1d98).publish_state(v[4]);
          break;
        case 1:  // 1E2A 1D4E 1E64 1CBE 1E82
          id(heizleistung_ist).publish_state(v[3]);
          id(reg_1e82).publish_state(v[4]);
          break;
        case 2:  // 1EA2 1D96 1E8C 1DEC 1E7C
          id(raumtemp).publish_state(v[0]);
          id(abgas).publish_state(v[1]);
          id(manuell).publish_state(v[3] == 1);
          id(tuer).publish_state(v[4] == 1);
          break;
      }
      return v[0];

  - platform: template
    id: abgas
    name: "Abgastemperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
  - platform: template
    id: luftschieber
    name: "Luftschieber"
    unit_of_measurement: "%"
    state_class: measurement
  - platform: template
    id: heizleistung_ist
    name: "Heizleistung"
    state_class: measurement
  - platform: template
    id: raumtemp
    name: "Raumtemperatur (?)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
  - platform: template
    id: phase
    name: "Phase (Rohwert)"
  - platform: template
    id: reg_1e82
    name: "Register 1E82"
  - platform: template
    id: reg_1d98
    name: "Register 1D98"

binary_sensor:
  - platform: template
    id: manuell
    name: "Luftschieber manuell"
  - platform: template
    id: tuer
    name: "Kamintür"
    device_class: door

# Verbindung trennen, damit die Handy-App wieder rankommt (nur 1 Verbindung moeglich)
switch:
  - platform: ble_client
    ble_client_id: neo
    name: "Kamin Bluetooth verbunden"
  - platform: template
    name: "Luftschieber Automatik"
    lambda: 'return !id(manuell).state;'
    turn_on_action:
      - script.execute:
          id: write_reg
          addr: 0x1DEC
          val: 0
    turn_off_action:
      - script.execute:
          id: write_reg
          addr: 0x1DEC
          val: 1

interval:
  - interval: 15s
    then:
      - script.execute: poll

script:
  # Register schreiben wie die App: FFF1 <- Adresse, FFF2 <- Wert (int16 LE)
  - id: write_reg
    mode: queued
    parameters:
      addr: int
      val: int
    then:
      - script.wait: poll
      - ble_client.ble_write:
          id: neo
          service_uuid: 'fff0'
          characteristic_uuid: 'fff1'
          value: !lambda |-
            return std::vector<uint8_t>{ (uint8_t)(addr & 0xFF), (uint8_t)((addr >> 8) & 0xFF) };
      - delay: 300ms
      - ble_client.ble_write:
          id: neo
          service_uuid: 'fff0'
          characteristic_uuid: 'fff2'
          value: !lambda |-
            uint16_t v = (uint16_t)(int16_t) val;
            return std::vector<uint8_t>{ (uint8_t)(v & 0xFF), (uint8_t)(v >> 8) };
      - logger.log:
          format: "Register 0x%04X <- %d"
          args: [ 'addr', 'val' ]
      - delay: 500ms

  - id: poll
    mode: single
    then:
      - script.wait: write_reg
      - globals.set: { id: block, value: '0' }
      - ble_client.ble_write:
          id: neo
          service_uuid: 'fff0'
          characteristic_uuid: 'fff1'
          value: [0xCE, 0x1C, 0x62, 0x1E, 0xD4, 0x1C, 0xF2, 0x1E, 0x98, 0x1D]
      - delay: 1500ms
      - component.update: fff2_raw
      - delay: 700ms

      - globals.set: { id: block, value: '1' }
      - ble_client.ble_write:
          id: neo
          service_uuid: 'fff0'
          characteristic_uuid: 'fff1'
          value: [0x2A, 0x1E, 0x4E, 0x1D, 0x64, 0x1E, 0xBE, 0x1C, 0x82, 0x1E]
      - delay: 1500ms
      - component.update: fff2_raw
      - delay: 700ms

      - globals.set: { id: block, value: '2' }
      - ble_client.ble_write:
          id: neo
          service_uuid: 'fff0'
          characteristic_uuid: 'fff1'
          value: [0xA2, 0x1E, 0x96, 0x1D, 0x8C, 0x1E, 0xEC, 0x1D, 0x7C, 0x1E]
      - delay: 1500ms
      - component.update: fff2_raw
      - delay: 700ms
      - globals.set: { id: block, value: '-1' }

# ---------------- Steuerung ----------------
# Aus PacketLogger-Traces:
#   0x1CBE  Heizleistung 1..3
#   0x1DEC  Luftschieber-Modus: 1 = manuell, 0 = Automatik
#   0x1E62  Luftschieber in % (wird im Manuellbetrieb gesetzt)

number:
  - platform: template
    name: "Heizleistung einstellen"
    min_value: 1
    max_value: 3
    step: 1
    lambda: 'return id(heizleistung_ist).state;'
    set_action:
      - script.execute:
          id: write_reg
          addr: 0x1CBE
          val: !lambda 'return (int) x;'

  - platform: template
    name: "Luftschieber manuell setzen"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: slider
    lambda: 'return id(luftschieber).state;'
    set_action:
      # wie die App: erst Manuellbetrieb an, dann Wert
      - script.execute:
          id: write_reg
          addr: 0x1DEC
          val: 1
      - script.execute:
          id: write_reg
          addr: 0x1E62
          val: !lambda 'return (int) x;'
